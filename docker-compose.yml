services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      # Postgres 18 keeps PGDATA under /var/lib/postgresql/18/docker
      - db-data:/var/lib/postgresql
    healthcheck:
      # -h forces TCP: on first start the init server listens on the unix socket only
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PORT: 3100
    ports:
      # Localhost only: on a server the reverse proxy is the public entry point
      - "127.0.0.1:${APP_PORT}:3100"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
